            - jpeg
            - png
            - webp
            - avif
      - name: contentBlocks
        component: contentBlocks
        required: false
      - name: status
        component: status
      - name: publishedAt
        label: Datum publikace
        type: date
        required: true
        options:
          format: yyyy-MM-dd
        description: Datum podle Europe/Prague. Budoucí článek se zveřejní až při prvním úspěšném buildu v daný den
          (pravidelný rebuild každou hodinu).
      - name: updatedAt
        label: Datum poslední úpravy
        type: date
        required: false
        default: ""
        options:
          time: true
          format: yyyy-MM-dd'T'HH:mm:ssXXX
      - name: author
        label: Autor
        type: reference
        required: false
        options:
          collection: people
          value: "{primary}"
          label: "{fields.name}"
          search: name,position,workplace
        description: Vyberte osobu. U starších článků je zachováno i společné autorství „Redakce školy“. Při změně
          jména zkontrolujte starší vazby.
      - name: categories
        component: categories
      - name: programs
        component: programs
      - name: tags
        component: tags
      - name: cover
        label: Titulní obrázek
        type: image
        required: false
        options:
          media: articles
          rename: safe
      - name: coverAlt
        label: Popis titulního obrázku (ALT)
        type: string
        required: false
        description: Popište obsah, pokud obrázek předává další informaci. V náhledových kartách má odkaz vlastní
          text; při prázdném poli se použije titulek článku.
      - name: attachments
        label: Přílohy
        type: object
