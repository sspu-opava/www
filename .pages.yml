                - image
              rename: safe
      - name: gallery
        label: Související galerie
        type: reference
        required: false
        options:
          collection: galleries
          value: "{name}"
          label: "{fields.title}"
          search: title,description
      - name: related
        label: Doporučené články
        type: reference
        required: false
        options:
