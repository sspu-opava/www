        sort: publishedAt
        order: desc
    fields:
      - name: title
        label: Titulek
        type: string
        required: true
      - name: description
        label: Perex
        type: text
        required: true
        description: 1–2 věty pro kartu článku, vyhledávání a sdílení. Neopakujte pouze titulek.
      - name: body
        component: body
        options:
          format: markdown
          switcher: true
          media: articles
          rename: safe
          extensions:
