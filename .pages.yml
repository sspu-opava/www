  - name: articles
    label: Aktuality a články
    type: collection
    path: src/content/articles
    filename: "{primary}.md"
    view:
      primary: title
      fields:
        - title
        - publishedAt
        - author
        - status
      search:
        - title
        - description
        - author
        - categories
        - tags
      sort:
        - publishedAt
        - title
