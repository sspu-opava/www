# Pages CMS: formuláře zachovávají původní plochý datový model. Viz PAGES-CMS.md.
media:
  - name: articles
    label: Fotografie článků
    input: public/uploads/articles
    output: /uploads/articles
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - avif
    rename: safe
  - name: images
    label: Obrázky pro obsah
    input: public/uploads/images
    output: /uploads/images
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - avif
    rename: safe
    actions:
      - name: optimize-images
        label: Připravit náhledy a zprávu o médiích
        workflow: optimize-images.yml
        ref: current
        confirm:
          title: Vytvořit optimalizované varianty?
          message: Vytvoří náhledy a přehled velikostí jako artefakt Actions. Web stejné náhledy připravuje při každém
            buildu; originály se nemění.
          button: Spustit optimalizaci
  - name: galleries
    label: Fotografie do galerií
    input: public/uploads/galleries
    output: /uploads/galleries
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - avif
    rename: safe
    actions:
      - name: optimize-gallery-images
        label: Připravit náhledy a zprávu o médiích
        workflow: optimize-images.yml
        ref: current
  - name: people
    label: Fotografie osob
    input: public/uploads/people
    output: /uploads/people
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - avif
    rename: safe
  - name: documents
    label: Dokumenty ke stažení
    input: public/uploads/documents
    output: /uploads/documents
    extensions:
      - pdf
      - doc
      - docx
      - odt
      - xls
      - xlsx
      - ods
      - ppt
      - pptx
    rename: safe
  - name: attachments
    label: Přílohy článků
    input: public/uploads/attachments
    output: /uploads/attachments
    extensions:
      - mp3
      - wav
      - ogg
      - m4a
      - pdf
      - doc
      - docx
      - odt
      - xls
      - xlsx
      - ods
      - ppt
      - pptx
      - jpg
      - jpeg
      - png
      - webp
      - avif
    categories:
      - document
      - image
      - audio
    rename: safe
  - name: job-offers
    label: Inzeráty pracovních nabídek
    input: public/uploads/job-offers
    output: /uploads/job-offers
    extensions:
      - pdf
      - doc
      - docx
      - odt
      - xls
      - xlsx
      - ods
      - ppt
      - pptx
      - jpg
      - jpeg
      - png
      - webp
      - avif
    categories:
      - document
      - image
    rename: safe
components:
  status:
    type: select
    label: Stav publikace
    options:
      values:
        - name: published
          label: Publikováno
        - name: draft
          label: Koncept (nezobrazí se na veřejném webu)
    default: draft
    required: true
    description: Koncept se nezobrazuje. Zveřejnění proběhne až po úspěšné kontrole a sestavení webu v GitHub Actions.
  programs:
    type: reference
    label: Studijní obory
    options:
      collection: programs
      multiple: true
      value: "{name}"
      label: "{fields.title}"
      search: title,code,description
    description: Vyberte obory, kterých se obsah týká. U celoškolního obsahu může seznam zůstat prázdný.
  categories:
    type: reference
    label: Kategorie
    options:
      collection: categories
      multiple: true
      value: "{primary}"
      label: "{fields.title}"
      search: title,description
    description: Vyberte existující rubriky. Název používané kategorie měňte společně s vazbami v obsahu.
  tags:
    type: string
    label: Štítky
    list: true
    description: Krátká opakovatelná témata. Dodržujte již používané názvy; obor a kategorii vyplňte v jejich
      samostatných polích.
  seo:
    type: object
    label: SEO a sdílení
    fields:
      - name: title
        label: SEO titulek
        type: string
        required: false
        description: Nechte prázdné pro použití hlavního názvu.
      - name: description
        label: Meta description
        type: text
        required: false
        options:
          maxlength: 160
      - name: canonical
        label: Kanonická URL
        type: string
        required: false
        description: Použijte jen při vědomém řešení duplicitního obsahu.
      - name: image
        label: Obrázek pro sdílení
        type: image
        required: false
        options:
          media: images
          rename: safe
      - name: noindex
        label: Neindexovat ve vyhledávačích
        type: boolean
        required: false
        default: false
  contentBlocks:
    type: block
    label: Obsahové bloky
    list:
      collapsible:
        collapsed: true
        summary: "{index}. {fields.title} {fields.text}"
    blockKey: type
    blocks:
      - name: heading
        label: Nadpis
        fields:
          - name: level
            label: Úroveň
            type: select
            options:
              values:
                - h2
                - h3
            default: h2
          - name: text
            label: Text nadpisu
            type: string
      - name: richText
        label: Formátovaný text (Markdown)
        fields:
          - name: title
            label: Nadpis oddílu (H2)
            type: string
            required: false
          - name: text
            component: body
            label: Text oddílu
            required: true
            description: Formátovaný text s odkazy, seznamy a citacemi; nadpis oddílu vyplňte výše.
      - name: text
        label: Prostý text
        fields:
          - name: title
            label: Nadpis bloku
            type: string
            required: false
          - name: text
            label: Text
            type: text
      - name: image
        label: Obrázek
        fields:
          - name: image
            label: Obrázek
            type: image
            options:
              media: images
              rename: safe
            required: true
          - name: alt
            label: ALT text
            type: string
            description: Popište sdělení obrázku. Čistě dekorativní obrázky patří do vzhledu šablony.
            required: true
          - name: caption
            label: Popisek
            type: text
            required: false
      - name: youtube
        label: YouTube video
        fields:
          - name: url
            label: URL videa
            type: string
            description: Vložte odkaz ve tvaru https://www.youtube.com/watch?v=… nebo https://youtu.be/…
          - name: title
            label: Popisek videa
            type: string
            required: false
      - name: audio
        label: Zvukový přehrávač
        fields:
          - name: src
            label: Soubor nebo URL audia
            type: file
            options:
              media: attachments
              categories:
                - audio
          - name: title
            label: Popisek audia
            type: string
            required: false
      - name: table
        label: Tabulka
        fields:
          - name: caption
            label: Nadpis tabulky
            type: string
            required: false
          - name: headers
            label: Záhlaví sloupců
            type: string
            list: true
          - name: rows
            label: Řádky
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.title} {fields.label} {fields.name}"
            fields:
              - name: cells
                label: Buňky řádku zleva doprava
                type: string
                list: true
      - name: twoColumns
        label: 2 sloupce
        fields:
          - name: items
            label: Sloupce
            type: object
            list:
              min: 2
              max: 2
              collapsible:
                collapsed: false
                summary: "{fields.title}"
            fields:
              - name: title
                label: Nadpis
                type: string
              - name: text
                label: Text
                type: text
      - name: threeColumns
        label: 3 sloupce
        fields:
          - name: items
            label: Sloupce
            type: object
            list:
              min: 3
              max: 3
              collapsible:
                collapsed: false
                summary: "{fields.title}"
            fields:
              - name: title
                label: Nadpis
                type: string
              - name: text
                label: Text
                type: text
      - name: columns
        label: 2–4 sloupce (kompatibilní)
        fields:
          - name: items
            label: Sloupce
            type: object
            list:
              min: 2
              max: 4
              collapsible:
                collapsed: false
                summary: "{fields.title}"
            fields:
              - name: title
                label: Nadpis
                type: string
              - name: text
                label: Text
                type: text
      - name: notice
        label: Informační box
        fields:
          - name: title
            label: Nadpis
            type: string
          - name: text
            label: Text
            type: text
      - name: cta
        label: Výzva k akci (CTA)
        fields:
          - name: title
            label: Nadpis
            type: string
          - name: text
            label: Text
            type: text
          - name: label
            label: Text tlačítka
            type: string
          - name: href
            label: Odkaz
            type: string
      - name: gallery
        label: Galerie
        fields:
          - name: gallery
            label: Vybraná galerie
            type: reference
            options:
              collection: galleries
              value: "{name}"
              label: "{fields.title}"
              search: title,description
      - name: documents
        label: Seznam dokumentů
        fields:
          - name: documents
            label: Dokumenty
            type: reference
            options:
              collection: documents
              multiple: true
              value: "{name}"
              label: "{fields.title}"
              search: title,description,category
      - name: downloads
        label: Ke stažení
        fields:
          - name: eyebrow
            label: Nadřazený popisek
            type: string
            required: false
          - name: title
            label: Nadpis seznamu
            type: string
            required: false
          - name: showHeading
            label: Zobrazit nadpisy bloku
            type: boolean
            default: true
            required: false
          - name: variant
            label: Vzhled bloku
            type: select
            options:
              values:
                - name: default
                  label: Běžný
                - name: night
                  label: Tmavě modrý
            default: default
          - name: items
            label: Soubory a odkazy
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.title} {fields.label} {fields.name}"
            fields:
              - name: label
                label: Název odkazu
                type: string
              - name: url
                label: URL nebo soubor
                type: string
              - name: description
                label: Popis
                type: text
                required: false
      - name: links
        label: Odkazy a dokumenty
        fields:
          - name: eyebrow
            label: Nadřazený popisek
            type: string
            required: false
          - name: title
            label: Nadpis
            type: string
            required: false
          - name: items
            label: Odkazy
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.title} {fields.label} {fields.name}"
            fields:
              - name: label
                label: Název odkazu
                type: string
              - name: url
                label: URL nebo soubor
                type: string
              - name: description
                label: Popis
                type: text
                required: false
              - name: kind
                label: Typ
                type: select
                options:
                  values:
                    - external
                    - document
                default: external
      - name: resourceGroups
        label: Tematické skupiny materiálů
        fields:
          - name: eyebrow
            label: Nadřazený popisek
            type: string
            required: false
          - name: title
            label: Nadpis seznamu
            type: string
            required: false
          - name: groups
            label: Skupiny materiálů
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.title} {fields.label} {fields.name}"
            fields:
              - name: title
                label: Název skupiny
                type: string
              - name: category
                label: Hlavní kategorie
                type: string
                required: false
              - name: description
                label: Popis skupiny
                type: text
                required: false
              - name: items
                label: Jednotlivé materiály
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{fields.title} {fields.label} {fields.name}"
                fields:
                  - name: label
                    label: Název
                    type: string
                  - name: url
                    label: URL nebo soubor
                    type: string
                  - name: description
                    label: Popis
                    type: text
                    required: false
                  - name: kind
                    label: Typ
                    type: select
                    options:
                      values:
                        - external
                        - document
                    default: document
              - name: series
                label: Série s číslovanými materiály
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{fields.title} {fields.label} {fields.name}"
                fields:
                  - name: urlTemplate
                    label: Vzor URL ({n} = číslo)
                    type: string
                  - name: labelTemplate
                    label: Vzor názvu ({n} = číslo)
                    type: string
                    required: false
                  - name: count
                    label: Počet položek
                    type: number
                  - name: start
                    label: První číslo
                    type: number
                    default: 1
                  - name: pad
                    label: Počet číslic
                    type: number
                    default: 2
                  - name: kind
                    label: Typ
                    type: select
                    options:
                      values:
                        - external
                        - document
                    default: document
      - name: articles
        label: Seznam aktualit
        fields:
          - name: articles
            label: Aktuality
            type: reference
            options:
              collection: articles
              multiple: true
              value: "{name}"
              label: "{fields.title}"
              search: title,description,author
      - name: people
        label: Osoby a kontakty
        fields:
          - name: showHeading
            label: Zobrazit nadpis Kontakty
            type: boolean
            default: true
            required: false
          - name: eyebrow
            label: Nadřazený popisek
            type: string
            required: false
          - name: title
            label: Nadpis seznamu
            type: string
            required: false
          - name: people
            label: Kontaktní osoby
            type: reference
            options:
              collection: people
              multiple: true
              value: "{name}"
              label: "{fields.name}"
              search: name,position,workplace
      - name: faq
        label: FAQ
        fields:
          - name: items
            label: Otázky a odpovědi
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{fields.title} {fields.label} {fields.name}"
            fields:
              - name: question
                label: Otázka
                type: string
              - name: answer
                label: Odpověď
                type: text
    description: Volitelné pro strukturované stránky. Neprázdný seznam nahrazuje Hlavní text. Pořadí bloků je
      pořadím na webu; používejte H2 pro oddíly a H3 pro pododdíly.
  body:
    type: rich-text
    label: Hlavní text
    required: false
    description: "Běžný článek pište zde: nadpisy od H2, odstavce, odkazy, seznamy, citace a obrázky s ALT textem.
      Pokud vyplníte Obsahové bloky, nahradí tento text. Starší HTML upravujte v režimu Markdown."
    options:
      format: markdown
      switcher: true
      media: images
      rename: safe
      extensions:
        - jpg
        - jpeg
        - png
        - webp
        - avif
  photo:
    type: object
    fields:
      - name: src
        label: Fotografie
        type: image
        required: true
        options:
          media: galleries
          rename: safe
      - name: alt
        label: Co je na fotografii (ALT)
        type: string
        required: true
        description: Stručně popište děj nebo důležitý obsah. Nepište název souboru ani pouze „fotografie“.
      - name: caption
        label: Viditelný popisek
        type: text
        required: false
        description: Doplňte okolnosti, jména nebo autora snímku, pokud je chcete zveřejnit.
content:
  - name: homepage-alerts
    label: Úvodní upozornění
    type: file
    path: src/data/homepage-alerts.json
    format: json
    fields:
      - name: alerts
        label: Upozornění na homepage
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.label}"
        fields:
          - name: id
            label: Interní identifikátor
            type: string
            required: true
            description: Krátký jedinečný název bez mezer; po vytvoření neměňte.
          - name: articleId
            label: Zvýrazněný článek
            type: reference
            required: true
            options:
              collection: articles
              value: "{name}"
              label: "{fields.title}"
              search: title,description
          - name: label
            label: Krátký popisek
            type: string
            required: true
          - name: enabled
            label: Zobrazovat
            type: boolean
            default: false
          - name: expiresAt
            label: Zobrazovat nejdéle do (včetně)
            type: date
            required: false
            options:
              format: yyyy-MM-dd
          - name: variant
            label: Podoba
            type: select
            default: text
            options:
              values:
                - name: text
                  label: Text
                - name: banner
                  label: Banner s obrázkem
          - name: tone
            label: Barva
            type: select
            default: mist
            options:
              values:
                - night
                - brand
                - mist
                - accent
          - name: desktopColumns
            label: Šířka na desktopu (z 12 sloupců)
            type: number
            default: 6
            options:
              min: 4
              max: 8
              step: 2
  - name: web-pages
    label: Stránky
    type: collection
    path: src/content/pages
    filename: "{primary}.md"
    view:
      primary: title
      fields:
        - title
        - status
      search:
        - title
        - description
        - eyebrow
      sort:
        - title
      default:
        sort: title
        order: asc
    fields:
      - name: title
        label: Název stránky
        type: string
        required: true
      - name: description
        label: Perex a meta description
        type: text
        required: true
      - name: body
        component: body
      - name: contentBlocks
        component: contentBlocks
        required: false
      - name: eyebrow
        label: Nadřazený popisek
        type: string
        required: false
      - name: highlight
        label: Zvýrazněná informace
        type: text
        required: false
      - name: status
        component: status
      - name: seo
        component: seo
  - name: jobOffers
    label: Nabídky zaměstnání a brigád
    type: collection
    path: src/content/job-offers
    filename: "{slug}.md"
    view:
      primary: position
      fields:
        - company
        - position
        - type
        - status
        - location
        - needsReview
      search:
        - title
        - company
        - position
        - summary
        - location
        - field
      sort:
        - status
        - publishedAt
        - company
      default:
        sort: publishedAt
        order: desc
    fields:
      - name: title
        label: Název nabídky
        type: string
        required: true
      - name: slug
        label: URL identifikátor
        type: string
        required: true
        pattern:
          regex: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          message: Použijte malá písmena bez diakritiky a slova oddělte pomlčkami.
        description: Trvalá část adresy a názvu souboru. U publikovaného záznamu ji neměňte bez přesměrování.
      - name: company
        label: Firma
        type: string
        required: true
      - name: companyUrl
        label: Web firmy
        type: string
        required: false
      - name: position
        label: Pracovní pozice
        type: string
        required: true
      - name: type
        label: Typ nabídky
        type: select
        required: false
        options:
          values:
            - name: job
              label: Pracovní nabídka
            - name: brigade
              label: Brigáda
            - name: internship
              label: Stáž
            - name: practice
              label: Praxe
        default: job
      - name: status
        label: Stav nabídky
        type: select
        required: true
        options:
          values:
            - name: active
              label: Aktuální
            - name: needs-review
              label: Vyžaduje ověření
            - name: closed
              label: Uzavřená
            - name: archived
              label: Archivní
      - name: visible
        label: Zobrazit veřejně
        type: boolean
        required: true
        default: false
      - name: needsReview
        label: Vyžaduje ověření aktuálnosti
        type: boolean
        required: false
        default: false
      - name: location
        label: Lokalita
        type: string
        required: false
      - name: employmentType
        label: Pracovní vztah
        type: string
        required: false
      - name: field
        label: Oblast
        type: string
        required: false
      - name: summary
        label: Krátký popis pro kartu
        type: text
        required: false
      - name: publishedAt
        label: Datum zveřejnění
        type: date
        required: false
        options:
          format: yyyy-MM-dd
      - name: expiresAt
        label: Termín platnosti
        type: date
        required: false
        options:
          format: yyyy-MM-dd
        description: Termín pro kontrolu aktuálnosti. Staré nabídky zůstávají v archivu; uzavření nastavte ve Stavu
          nabídky.
      - name: featured
        label: Zvýraznit v přehledu
        type: boolean
        required: false
        default: false
      - name: applyUrl
        label: Hlavní odkaz pro reakci
        type: string
        required: false
      - name: attachments
        label: Přílohy nabídky
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.title} {fields.label} {fields.name}"
        required: false
        fields:
          - name: label
            label: Název přílohy
            type: string
            required: true
          - name: file
            label: Soubor
            type: file
            required: true
            options:
              media: job-offers
          - name: type
            label: Typ souboru
            type: string
            required: false
      - name: sourceLinks
        label: Externí odkazy
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.title} {fields.label} {fields.name}"
        required: false
        fields:
          - name: label
            label: Název odkazu
            type: string
            required: true
          - name: url
            label: URL
            type: string
            required: true
          - name: type
            label: Typ odkazu
            type: string
            required: false
      - name: contactEmail
        label: Kontaktní e-mail
        type: string
        required: false
      - name: contactPhone
        label: Kontaktní telefon
        type: string
        required: false
      - name: body
        component: body
  - name: projects
    label: Projekty
    type: collection
    path: src/content/projects
    filename: "{slug}.md"
    view:
      primary: title
      fields:
        - title
        - status
        - startDate
        - endDate
        - programme
      search:
        - title
        - summary
        - programme
        - topics
        - registrationNumber
        - projectNumber
      sort:
        - status
        - startDate
        - title
      default:
        sort: startDate
        order: desc
    fields:
      - name: title
