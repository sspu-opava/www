name: Prepare responsive images

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare responsive images
        run: npm run media:prepare

      - name: Upload responsive images and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: responsive-images
          path: |
            public/_media/
            src/data/generated-media.json
            reports/media.*
          if-no-files-found: warn
